<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Személyes jegyzetek alkalmazás">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jegyzetek">
  <title>📝 Jegyzetek</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== TÖLTÉS ===================== -->
  <div id="view-loading" class="view active">
    <div class="loading-screen">
      <div class="loading-logo">📝</div>
      <div class="loading-spinner"></div>
      <p class="loading-text">Betöltés…</p>
    </div>
  </div>

  <!-- ===================== BEJELENTKEZÉS ===================== -->
  <div id="view-login" class="view">
    <div class="login-bg">
      <div class="login-card">
        <div class="login-logo">📝</div>
        <h1 class="login-title">Jegyzetek</h1>
        <p class="login-subtitle">Jelentkezz be a folytatáshoz</p>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="inp-username">Felhasználónév</label>
            <input type="text" id="inp-username" placeholder="felhasználónév"
              autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="form-group">
            <label for="inp-password">Kód</label>
            <input type="password" id="inp-password" placeholder="••••••••"
              autocomplete="current-password" required>
          </div>
          <p class="login-error hidden" id="login-error">Hibás felhasználónév vagy kód.</p>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            <span class="btn-label">Belépés</span>
            <span class="btn-spinner hidden">⏳</span>
          </button>
        </form>
      </div>
    </div>
  </div>


  <!-- ===================== TÉMÁK LISTA ===================== -->
  <div id="view-topics" class="view">
    <header class="app-header">
      <h1 class="header-title">📝 Jegyzetek</h1>
      <div class="header-actions">
        <button class="icon-btn" id="btn-toggle-view" title="Nézet váltása" aria-label="Nézet váltása">⊞</button>
        <button class="icon-btn" id="btn-logout" title="Kijelentkezés" aria-label="Kijelentkezés">⏻</button>
      </div>
    </header>
    <main class="topics-main">
      <div id="topics-container" class="topics-grid"></div>
      <div class="empty-state hidden" id="empty-topics">
        <div class="empty-icon">📋</div>
        <p class="empty-title">Még nincsenek témák</p>
        <p class="empty-sub">Adj hozzá egyet a + gombbal</p>
      </div>
    </main>
    <button class="fab" id="btn-add-topic" aria-label="Új téma hozzáadása">＋</button>
  </div>

  <!-- ===================== TÉMA RÉSZLET ===================== -->
  <div id="view-topic" class="view">
    <header class="app-header topic-header">
      <button class="icon-btn" id="btn-back" aria-label="Vissza">←</button>
      <h1 class="header-title" id="topic-title-label">Téma</h1>
      <button class="icon-btn" id="btn-delete-topic" title="Téma törlése" aria-label="Téma törlése">🗑</button>
    </header>
    <main class="topic-main">
      <div id="items-container"></div>
      <div class="empty-state hidden" id="empty-items">
        <div class="empty-icon">✅</div>
        <p class="empty-title">Minden kész!</p>
        <p class="empty-sub">Írj be egy új feladatot lent</p>
      </div>
    </main>
    <div class="add-item-bar">
      <input type="text" id="inp-new-item" placeholder="Új feladat…" maxlength="200" autocomplete="off">
      <button class="btn btn-primary" id="btn-add-item">Hozzáad</button>
    </div>
  </div>

  <!-- ===================== MODAL: ÚJ TÉMA ===================== -->
  <div class="modal-overlay hidden" id="modal-topic" role="dialog" aria-modal="true">
    <div class="modal" id="modal-box">
      <h2 class="modal-title">Új téma</h2>
      <div class="form-group">
        <label for="inp-topic-name">Téma neve</label>
        <input type="text" id="inp-topic-name" placeholder="pl. Bevásárlás" maxlength="50" required>
      </div>
      <div class="form-group">
        <label>Szín</label>
        <div class="color-picker" id="color-picker" role="radiogroup" aria-label="Szín választása"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-cancel-topic">Mégse</button>
        <button class="btn btn-primary" id="btn-save-topic">Mentés</button>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
